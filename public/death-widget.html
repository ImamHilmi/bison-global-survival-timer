<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BISON Death Counter</title>
    <link rel="stylesheet" href="death-widget.css">
</head>
<body>

<main class="death-widget" aria-label="BISON death counter">

    <section id="deathCard" class="death-card">
        <div class="top-edge"></div>
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>
        <div class="particle p6"></div>

        <div class="side-mark left"></div>
        <div class="side-mark right"></div>

        <div class="death-content">
            <div class="death-titles">
                <div id="gameName" class="game-name">PALWORLD</div>
                <div class="label">DEATH COUNT</div>
            </div>

            <div id="deathNumber" class="death-number">0</div>

            <div id="lostBadge" class="lost-badge">SURVIVAL ACTIVE</div>
        </div>

        <div class="flash"></div>
        <div class="red-pulse"></div>
    </section>

</main>

<script src="death-widget.js"></script>
</body>
</html>
