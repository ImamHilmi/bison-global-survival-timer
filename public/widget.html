<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BISON Survival Timer</title>
    <link rel="stylesheet" href="widget.css">
</head>
<body>

<main class="widget" aria-label="BISON survival timer">

    <section id="timerCard" class="timer-card">
        <div class="scanline"></div>
        <div class="ambient-glow"></div>

        <header class="header">
            <div class="game-badge">B</div>

            <div class="titles">
                <div id="gameName" class="title">PALWORLD</div>
                <div id="modeName" class="subtitle">HARDCORE SURVIVAL</div>
            </div>

            <div class="state-chip">
                <span id="stateDot" class="state-dot"></span>
                <span id="stateText">PAUSED</span>
            </div>
        </header>

        <div class="divider"></div>

        <div id="timer" class="timer">00:00:00</div>

        <div class="timer-meta">
            <span class="meta-line"></span>
            <span id="survivalLabel">WORLD SURVIVAL</span>
            <span class="meta-line"></span>
        </div>
    </section>

</main>

<script src="widget.js"></script>
</body>
</html>
